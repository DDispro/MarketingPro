<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketingPro 诊断报告</title>
    <style>
        :root{--p:#2563eb;--s:#10b981;--w:#f59e0b;--d:#ef4444;--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--ts:#94a3b8}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;padding:2rem}
        .container{max-width:1200px;margin:0 auto}
        .header{text-align:center;margin-bottom:2rem;padding:2rem;background:linear-gradient(135deg,var(--p),#7c3aed);border-radius:1rem}
        .header h1{font-size:1.75rem;margin-bottom:.5rem}
        .card{background:var(--c);border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem}
        .card h2{font-size:1.1rem;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid rgba(255,255,255,.1)}
        .score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
        .score-item{background:rgba(255,255,255,.05);border-radius:.75rem;padding:1rem;text-align:center}
        .score-value{font-size:2rem;font-weight:700}.score-value.h{color:var(--s)}.score-value.m{color:var(--w)}.score-value.l{color:var(--d)}
        .score-label{font-size:.8rem;color:var(--ts);margin-top:.25rem}
        .badge{display:inline-flex;padding:.75rem 1.5rem;border-radius:9999px;font-weight:600}
        .badge.p{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1e293b}
        .badge.r{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
        .badge.t{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
        table{width:100%;border-collapse:collapse}
        th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
        th{background:rgba(255,255,255,.03);font-size:.75rem;text-transform:uppercase;color:var(--ts)}
        .sb{display:inline-flex;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem}
        .sb.p{background:rgba(16,185,129,.2);color:var(--s)}.sb.w{background:rgba(245,158,11,.2);color:var(--w)}.sb.f{background:rgba(239,68,68,.2);color:var(--d)}
        .action-list{list-style:none}
        .action-item{display:flex;gap:1rem;padding:1rem;background:rgba(255,255,255,.03);border-radius:.75rem;margin-bottom:.75rem}
        .priority{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
        .p1{background:var(--d)}.p2{background:var(--w)}.p3{background:var(--p)}
        .prompt{background:rgba(0,0,0,.3);border-radius:.5rem;padding:1rem;font-family:monospace;font-size:.8rem;white-space:pre-wrap;margin-top:.5rem}
        .footer{text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1);color:var(--ts);font-size:.8rem}
        .research-card{background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(124,58,237,.1));border:1px solid rgba(37,99,235,.3)}
        .research-card h2{border-bottom-color:rgba(37,99,235,.3)}
        .blind-spot{background:rgba(239,68,68,.1);border-left:3px solid var(--d);padding:.75rem;border-radius:0 .5rem .5rem 0;margin:.5rem 0}
        .opportunity{background:rgba(16,185,129,.1);border-left:3px solid var(--s);padding:.75rem;border-radius:0 .5rem .5rem 0;margin:.5rem 0}
        @media print{body{background:#fff;color:#000}.card{background:#fff;border:1px solid #ddd}}
    </style>
</head>
<body>
<div class="container">
<header class="header">
    <h1>MarketingPro 品牌营销诊断报告</h1>
    <div>{{generate_date}}</div>
</header>

<section class="card research-card">
    <h2>Deep Research 市场现状调研与竞品盲区扫描</h2>
    <div>{{research_content}}</div>
</section>

<section class="card">
    <h2>商业健康度评分</h2>
    <div class="score-grid">
        <div class="score-item"><div class="score-value {{sc}}">{{sb}}</div><div class="score-label">品牌资产</div></div>
        <div class="score-item"><div class="score-value {{ss}}">{{ssv}}</div><div class="score-label">战略清晰度</div></div>
        <div class="score-item"><div class="score-value {{sf}}">{{sfv}}</div><div class="score-label">4P协同度</div></div>
        <div class="score-item"><div class="score-value {{sg}}">{{sgv}}</div><div class="score-label">增长方式匹配</div></div>
    </div>
</section>

<section class="card">
    <div class="badge {{bt}}">{{bn}}</div>
    <p style="margin-top:1rem;color:var(--ts)">{{bd}}</p>
</section>

<section class="card">
    <h2>4P错配诊断</h2>
    <table>{{4p_rows}}</table>
</section>

<section class="card">
    <h2>纠偏行动清单</h2>
    <ul class="action-list">{{actions}}</ul>
</section>

<section class="card">
    <h2>视觉物料建议</h2>
    <h3 style="font-size:.95rem;margin:1rem 0 .5rem">超级符号Prompt</h3>
    <div class="prompt">{{sp}}</div>
    <h3 style="font-size:.95rem;margin:1rem 0 .5rem">包装渲染Prompt</h3>
    <div class="prompt">{{pp}}</div>
</section>

<footer class="footer">
    <p>品牌唯一目的 = 0成本复购 = 取消销售</p>
</footer>
</div>
</body>
</html>
